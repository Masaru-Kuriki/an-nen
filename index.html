<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>アンネン</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="top-header">
      <img src="assets/title.png" alt="白って200色アンネン!!!" class="title-logo">
      <img src="assets/normal_top.png" alt="" class="mascot">
    </header>

    <section class="player-select">
      <h2 class="select-heading">誰があそぶ？</h2>

      <div class="card-grid" id="cardGrid">
        <!-- カードはJSで動的生成 -->
        <div class="card-loading">読み込み中...</div>
      </div>
    </section>
  </main>

  <div class="orientation-lock" aria-hidden="true">
    <div class="orientation-lock-icon">📱</div>
    <div class="orientation-lock-text">縦向きでプレイしてね</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="top.js"></script>
  <script src="click.js"></script>
</body>
</html>
