<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>結果 - アンネン</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container container--result">
    <h1 class="result-title" id="resultTitle">クリア！</h1>
    <p class="result-score" id="resultScore"></p>
    <div class="result-actions" id="resultActions" aria-hidden="true">
      <button class="result-btn result-btn--retry" id="btnRetry">もう一回</button>
      <button class="result-btn result-btn--quit" id="btnQuit">やめる</button>
    </div>
  </main>

  <div class="orientation-lock" aria-hidden="true">
    <div class="orientation-lock-icon">📱</div>
    <div class="orientation-lock-text">縦向きでプレイしてね</div>
  </div>

  <!-- 演出オーバーレイ：起動時に出てフワッと消える -->
  <div class="result-overlay" id="resultOverlay">
    <img src="assets/clear.png" alt="" class="result-mascot" id="resultMascot">
    <div class="result-line" id="resultLine">白って200色あんねん</div>
  </div>

  <script src="audio.js"></script>
  <script src="result.js"></script>
  <script src="click.js"></script>
</body>
</html>
